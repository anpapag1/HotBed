<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotbed — 3D Print Order Tracker</title>
    <meta name="description" content="Hotbed — Live 3D print pipeline & order tracking. Track your 3D printed parts through every stage of production in real-time." />

    <!-- Open Graph / Facebook / Instagram / WhatsApp / Messenger -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hotbed" />
    <meta property="og:title" content="Hotbed — Live 3D Print Order Tracker" />
    <meta property="og:description" content="Track your custom 3D print order live through every stage of production in real-time." />
    <meta property="og:image" content="/og-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hotbed 3D Print Pipeline Preview" />

    <!-- Twitter / Discord -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hotbed — Live 3D Print Order Tracker" />
    <meta name="twitter:description" content="Track your custom 3D print order live through every stage of production in real-time." />
    <meta name="twitter:image" content="/og-preview.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('hotbed_theme_mode') || 'device';
          var resolved = mode === 'device'
            ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : mode;
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
